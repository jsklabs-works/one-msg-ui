<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- one-msg-ui mark: a hub-and-spoke node diagram — three brokers
       (Kafka/Solace/MQ, in the app's own categorical trio, same fixed
       order as every SystemTypeBadge) converging on one unified view.
       Tile background reuses the exact gradient .brand-mark already
       used in the app header (src/index.css), so the favicon and the
       in-app mark read as the same logo. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="0.55" stop-color="#eb6834"/>
      <stop offset="1" stop-color="#1baf7a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#tile)"/>
  <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.92">
    <line x1="16" y1="17" x2="16" y2="7.5"/>
    <line x1="16" y1="17" x2="24.23" y2="21.75"/>
    <line x1="16" y1="17" x2="7.77" y2="21.75"/>
  </g>
  <circle cx="16" cy="7.5" r="3" fill="#fff"/>
  <circle cx="24.23" cy="21.75" r="3" fill="#fff"/>
  <circle cx="7.77" cy="21.75" r="3" fill="#fff"/>
  <circle cx="16" cy="17" r="4" fill="#fff"/>
</svg>
