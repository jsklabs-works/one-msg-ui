name: Publish Docker image

# Builds the root Dockerfile (see README.md's "Packaging for distribution")
# and pushes it to GitHub Container Registry, so installing this app
# becomes `docker pull` instead of cloning the repo and building it
# yourself. Runs on a version tag (a real release) or manually — not on
# every push to main, so `latest` only moves when someone actually cuts
# a release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # linux/amd64 alone left arm64 machines (e.g. Apple Silicon) with
      # "no matching manifest for linux/arm64/v8" on docker pull — found
      # live, not anticipated. QEMU below lets buildx cross-build the
      # arm64 image on this (amd64) runner instead of needing a second,
      # natively-arm64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
