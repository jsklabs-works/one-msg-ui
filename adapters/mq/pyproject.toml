[project]
name = "mq-adapter"
version = "0.1.0"
description = "IBM MQ adapter for one-msg-ui — normalizes the REST Admin + Messaging APIs into the shared schema (see /docs/architecture.md)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
