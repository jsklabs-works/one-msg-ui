[project]
name = "kafka-adapter"
version = "0.1.0"
description = "Kafka adapter for one-msg-ui — normalizes Kafka's monitoring surface into the shared schema (see /docs/architecture.md)"
requires-python = ">=3.10"
dependencies = [
    "kafka-python-ng>=2.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
