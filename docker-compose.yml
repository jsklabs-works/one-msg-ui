# Local dev broker for the Kafka adapter (Phase 1). Single-node KRaft mode —
# no ZooKeeper needed. See adapters/kafka/README.md for how to point the
# adapter at this.
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: one-msg-ui-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local dev queue manager for the MQ adapter (Phase 3). Developer-license
  # image — see adapters/mq/README.md for how to point the adapter at this.
  # Default admin: admin/adminpassw0rd. Default app user: app/apppassw0rd.
  # Default queue manager: QM1. Dev-mode ships a default DEV.QUEUE.1 queue
  # plus a DEV.APP.SVRCONN channel, both auto-created.
  mq:
    image: icr.io/ibm-messaging/mq:latest
    platform: linux/amd64  # IBM ships amd64-only images; emulated via Rosetta/QEMU on Apple Silicon
    container_name: one-msg-ui-mq
    ports:
      - "1414:1414"   # MQ listener (MQI protocol)
      - "9543:9443"   # HTTPS web console + REST Admin/Messaging APIs
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_ADMIN_PASSWORD: adminpassw0rd
      MQ_APP_PASSWORD: apppassw0rd
    healthcheck:
      # No curl/wget in this image (verified via `docker exec ... which curl`),
      # so check queue manager status with MQ's own dspmq CLI instead — it's
      # always present and needs no auth flags to get wrong.
      test: ["CMD-SHELL", "dspmq -m QM1 | grep -qi 'STATUS(Running)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  # Local dev broker for the RabbitMQ adapter. The "-management" image
  # ships the rabbitmq_management plugin enabled by default — that plugin's
  # HTTP API is the adapter's only dependency, see adapters/rabbitmq/README.md.
  # Explicit admin/admin credentials rather than relying on the default
  # guest/guest, which RabbitMQ restricts to loopback-only connections.
  rabbitmq:
    image: rabbitmq:4-management
    container_name: one-msg-ui-rabbitmq
    ports:
      - "5673:5672"   # AMQP — not used by this adapter (management API covers everything,
                      # including peek), published anyway in case something else needs it;
                      # 5672 stays free for the standalone Solace broker below.
      - "15672:15672" # management HTTP API + web console
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local dev broker for the ActiveMQ Artemis adapter. The web console
  # (with its bundled Jolokia agent — this adapter's only dependency, see
  # adapters/activemq/README.md) is enabled by default; ARTEMIS_USER/
  # ARTEMIS_PASSWORD set the one login it needs.
  activemq:
    image: apache/activemq-artemis:latest
    container_name: one-msg-ui-activemq
    ports:
      - "61616:61616" # CORE/AMQP/MQTT/OPENWIRE/STOMP acceptor — not used by this adapter
                      # (Jolokia covers everything, including peek), published anyway
      - "8161:8161"   # web console + Jolokia REST API
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8161/console/jolokia/version || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

# No Solace service here (Phase 2): this dev machine already runs a
# standalone Solace PubSub+ broker (container "pubSubStandardSingleNode",
# not managed by this docker-compose file) at the default ports —
# SEMP :8080, AMQP :5672, MQTT :1883, SMF :55554. The Solace adapter targets
# that directly. See adapters/solace/README.md.
